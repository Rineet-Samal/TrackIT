<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1565d8" />
  <title>TrackIT</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-bar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Go back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 7 12l8.5 7.5" /></svg>
    </button>

    <div class="brand">
      <img src="icons/icon.svg" alt="" class="brand-mark" />
      <h1 class="brand-name">Track<span>IT</span></h1>
    </div>

    <button id="menuBtn" class="icon-btn" aria-label="App info">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 7.6v.9" /></svg>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="app-footer">
    <span>TrackIT &mdash; developed by <strong>Rin8</strong></span>
  </footer>

  <dialog id="infoDialog" class="sheet">
    <h2>About TrackIT</h2>
    <p>A simple shopping tracker for friends &amp; family. Add what you need under a category, note the preferred brand and quantity, attach a photo, and tick items off as you buy them.</p>
    <p class="muted">All data is stored privately on this device.</p>
    <form method="dialog"><button class="btn btn-primary">Got it</button></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
